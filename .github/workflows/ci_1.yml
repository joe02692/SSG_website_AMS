# Runs on every push and pull request: type-check, lint, production build.
# A red X on a commit means it would have broken the live site — fix before merging.
#
# The env values below are build-time dummies: the build only needs the
# variables to exist, real values live in Vercel. Never put real secrets here.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Type-check, lint, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Next generates the route-type globals (LayoutProps, PageProps, ...)
      # into .next/types. On a fresh checkout that folder doesn't exist yet,
      # so tsc must not run before this step.
      - name: Generate route types
        run: npx next typegen

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
